# 提示词测评配置文件

prompts:
  - id: v_unified
    description: 统一格式版本，输出与并行版相同的 JSON Schema
    system_instruction_file: prompts/v_unified.system.md
    user_prompt_file: prompts/v_unified.user.md

  - id: v1_base
    description: 基础版本，稳定性比较好,但是速度比较慢
    system_instruction_file: prompts/v1_base.system.md
    user_prompt_file: prompts/v1_base.user.md

  - id: v1_remove_header
    description: 基础版本，来自现有代码,移除了header
    system_instruction_file: prompts/v1_remove_header.system.md
    user_prompt_file: prompts/v1_remove_header.user.md

  - id: v2_base
    description: 中文版本
    system_instruction_file: prompts/v2_base.system.md
    user_prompt_file: prompts/v2_base.user.md

  - id: v3_merged_gried
    description: 多张图片拼接为一张返回
    system_instruction_file: prompts/v3_merged_gried.system.md

model_configs:
  - id: default
    temperature: 1.0
    top_k: 40
    top_p: 0.95
    description: 默认配置
