# 提示词测评配置文件 - 纯图片模态版本
# response_modalities = ["Image"]
# 只生成图片，不输出JSON

prompts:
  - id: v_unified
    description: 统一格式版本，生成与并行版相同的构图图片（纯图输出）
    system_instruction_file: prompts/v_unified.system.md
    user_prompt_file: prompts/v_unified.user.md

  - id: v1_pure_image
    description: 纯图片模式 - 基础版
    system_instruction_file: prompts/v1_pure_image.system.md
    user_prompt_file: prompts/v1_pure_image.user.md

  - id: v2_pure_image_cn
    description: 纯图片模式 - 中文简洁版
    system_instruction_file: prompts/v2_pure_image_cn.system.md
    user_prompt_file: prompts/v2_pure_image_cn.user.md

  - id: v3_pure_image_minimal
    description: 纯图片模式 - 极简版
    system_instruction_file: prompts/v3_pure_image_minimal.system.md
    user_prompt_file: prompts/v3_pure_image_minimal.user.md

model_configs:
  - id: default
    temperature: 1.0
    top_k: 40
    top_p: 0.95
    description: 默认配置

  - id: precise
    temperature: 0.5
    top_k: 20
    top_p: 0.8
    description: 高精确性，更稳定的输出
