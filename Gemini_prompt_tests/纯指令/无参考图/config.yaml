# 提示词测评配置文件 - 纯文本模态版本
# response_modalities = ["Text"]
# 只输出JSON指令，不生成图片

prompts:
  - id: v_unified
    description: 统一格式版本，输出与并行版相同的 JSON Schema（纯文本）
    system_instruction_file: prompts/v_unified.system.md
    user_prompt_file: prompts/v_unified.user.md

  - id: v2_cot
    description: Chain-of-Thought 推理 + 严格拒绝条件 + action 枚举，降低指令幻觉
    system_instruction_file: prompts/v2_cot.system.md
    user_prompt_file: prompts/v2_cot.user.md

model_configs:
  - id: default
    temperature: 1.0
    top_k: 40
    top_p: 0.95
    description: 默认配置
