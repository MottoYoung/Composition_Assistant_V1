# 提示词测评配置文件 - 纯指令/有参考图版本
# 输入：原始照片 + 参考构图图（目标图）
# 输出：从原图到参考图的相机操作JSON指令

prompts:
  - id: v1_cot
    description: 给定原图和参考图，用CoT推理生成对齐操作指令
    system_instruction_file: prompts/v1_cot.system.md
    user_prompt_file: prompts/v1_cot.user.md

  - id: v2_simple
    description: 给定原图和参考图，直接输出操作指令，无推理过程（对照基准）
    system_instruction_file: prompts/v2_simple.system.md
    user_prompt_file: prompts/v2_simple.user.md

model_configs:
  - id: default
    temperature: 1.0
    top_k: 40
    top_p: 0.95
    description: 默认配置
